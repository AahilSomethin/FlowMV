pid /tmp/nginx.pid;
events { worker_connections 512; }
http {
  include /etc/nginx/mime.types;
  log_format safe '$request_id $request_method $uri $status $request_time';
  access_log /dev/stdout safe;
  error_log /dev/stderr warn;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  server_tokens off;
  map $host $hsts_policy { default "max-age=31536000"; localhost ""; 127.0.0.1 ""; }
  client_max_body_size 10m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  server {
    listen 8443 ssl;
    ssl_certificate /certs/web.crt;
    ssl_certificate_key /certs/web.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security $hsts_policy always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location ~ ^/(api/|sanctum/|up$) {
      limit_req zone=api burst=60 nodelay;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /app/backend/public/index.php;
      fastcgi_param SCRIPT_NAME /index.php;
      fastcgi_param HTTPS on;
      fastcgi_param HTTP_HOST $http_host;
      fastcgi_param HTTP_X_FORWARDED_PROTO https;
      fastcgi_param HTTP_X_FORWARDED_FOR $remote_addr;
      fastcgi_pass api:9000;
      fastcgi_read_timeout 35s;
    }
    location / {
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_http_version 1.1;
      proxy_read_timeout 35s;
      proxy_pass http://web:3000;
    }
  }
}
